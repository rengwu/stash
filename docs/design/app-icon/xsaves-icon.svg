<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="smoke-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3F47"/><stop offset="1" stop-color="#121418"/></linearGradient>
    <linearGradient id="smoke-pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9B2BD" stop-opacity="0.8"/><stop offset="1" stop-color="#3B424B" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="smoke-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDFDFE"/><stop offset="0.45" stop-color="#CBD1D9"/><stop offset="0.7" stop-color="#9AA3AF"/><stop offset="1" stop-color="#DDE2E8"/></linearGradient>
    <linearGradient id="smoke-label" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0EDE6"/></linearGradient>
    <linearGradient id="smoke-gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="smoke-disk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.22" stop-color="#1A1F2A" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#1A1F2A" stop-opacity="0.42"/>
      <stop offset="0.92" stop-color="#1A1F2A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1A1F2A" stop-opacity="0"/>
    </radialGradient>
    <filter id="smoke-sh" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/><feOffset dy="30" result="b"/>
      <feFlood flood-color="#000000" flood-opacity="0.42"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smoke-lsh" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="4" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.22"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smoke-icon" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11"/><feOffset dy="11" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.3"/><feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="smoke-sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="smoke-body"><path d="M272,236 H700 L788,324 V752 A36,36 0 0 1 752,788 H272 A36,36 0 0 1 236,752 V272 A36,36 0 0 1 272,236 Z"/></clipPath>
  </defs>
  <g filter="url(#smoke-icon)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#smoke-bg)"/></g>
  <g clip-path="url(#smoke-sq)">
    <g transform="translate(512 512) rotate(-7) scale(1.06) translate(-512 -512)">
      <!-- the disk's thickness, then the translucent face -->
      <g filter="url(#smoke-sh)">
        <path d="M272,236 H700 L788,324 V752 A36,36 0 0 1 752,788 H272 A36,36 0 0 1 236,752 V272 A36,36 0 0 1 272,236 Z" transform="translate(0 18)" fill="#1C2026" opacity="0.9"/>
        <path d="M272,236 H700 L788,324 V752 A36,36 0 0 1 752,788 H272 A36,36 0 0 1 236,752 V272 A36,36 0 0 1 272,236 Z" fill="url(#smoke-pl)"/>
      </g>
      <g clip-path="url(#smoke-body)">
        <!-- magnetic disk and hub seen through the plastic -->
        <circle cx="512" cy="548" r="244" fill="url(#smoke-disk)"/>
        <circle cx="512" cy="548" r="238" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
        <circle cx="512" cy="548" r="62" fill="#E8ECF0" opacity="0.8"/>
        <rect x="490" y="526" width="44" height="44" rx="6" fill="#7C8794" opacity="0.85"/>
        <!-- channel the shutter slides in -->
        <rect x="292" y="236" width="420" height="214" fill="#1C2026" opacity="0.22"/>
        <rect x="292" y="446" width="420" height="5" fill="#FFFFFF" opacity="0.35"/>
        <!-- write-protect and density holes -->
        <rect x="258" y="716" width="40" height="44" rx="7" fill="#121418"/>
        <rect x="258" y="716" width="40" height="20" rx="6" fill="#1C2026" opacity="0.85"/>
        <rect x="726" y="716" width="40" height="44" rx="7" fill="#121418"/>
        <path d="M236,236 H640 L236,640 Z" fill="url(#smoke-gloss)"/>
      </g>
      <path d="M272,236 H700 L788,324 V752 A36,36 0 0 1 752,788 H272 A36,36 0 0 1 236,752 V272 A36,36 0 0 1 272,236 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.41000000000000003" stroke-width="5"/>
      <!-- metal shutter with its window onto the disk -->
      <g filter="url(#smoke-lsh)">
        <rect x="352" y="236" width="318" height="204" rx="10" fill="url(#smoke-metal)"/>
      </g>
      <rect x="566" y="268" width="64" height="140" rx="8" fill="#3A3F48"/>
      <rect x="566" y="268" width="64" height="140" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
      <rect x="352" y="236" width="318" height="10" fill="#FFFFFF" opacity="0.7"/>
      <!-- paper label with a bookmark -->
      <g filter="url(#smoke-lsh)">
        <path d="M318,532 A26,26 0 0 1 344,506 H680 A26,26 0 0 1 706,532 V788 H318 Z" fill="url(#smoke-label)"/>
      </g>
      <path d="M378,560 H456 V668 L417,640 L378,668 Z" fill="#2F7BFF"/>
      <path d="M378,560 H456 V574 H378 Z" fill="#FFFFFF" opacity="0.25"/>
      <rect x="490" y="570" width="168" height="18" rx="9" fill="#C9C3B8"/>
      <rect x="490" y="606" width="124" height="18" rx="9" fill="#C9C3B8"/>
      <rect x="378" y="704" width="280" height="8" rx="4" fill="#E2DDD3"/>
      <rect x="378" y="740" width="280" height="8" rx="4" fill="#E2DDD3"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
</svg>
